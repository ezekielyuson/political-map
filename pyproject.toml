[project]
name = "pge"
version = "0.1.0"
description = "Political Graph Intelligence Engine — public US political relationship graph."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sqlite-utils>=3.36",
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "rapidfuzz>=3.14.5",
    "streamlit>=1.57.0",
]

[project.scripts]
pge = "pge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Pydantic raw-API models intentionally mirror upstream camelCase field names
# so `model_validate(raw_dict)` works without a field map.
"src/pge/sources/*/parse.py" = ["N815"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
